databaseChangeLog:

  - changeSet:
      id: 003-oauth2-authorization
      author: yaroslav
      changes:
        - createTable:
            tableName: oauth2_authorization
            columns:
              - column:
                  name: id
                  type: varchar(100)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_oauth2_authorization
              - column:
                  name: registered_client_id
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: principal_name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: authorization_grant_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: authorized_scopes
                  type: varchar(1000)
              - column:
                  name: attributes
                  type: text
              - column:
                  name: state
                  type: varchar(500)

              # ---- authorization code ----
              - column:
                  name: authorization_code_value
                  type: text
              - column:
                  name: authorization_code_issued_at
                  type: timestamp
              - column:
                  name: authorization_code_expires_at
                  type: timestamp
              - column:
                  name: authorization_code_metadata
                  type: text

              # ---- access token ----
              - column:
                  name: access_token_value
                  type: text
              - column:
                  name: access_token_issued_at
                  type: timestamp
              - column:
                  name: access_token_expires_at
                  type: timestamp
              - column:
                  name: access_token_metadata
                  type: text
              - column:
                  name: access_token_type
                  type: varchar(100)
              - column:
                  name: access_token_scopes
                  type: varchar(1000)

              # ---- oidc id token ----
              - column:
                  name: oidc_id_token_value
                  type: text
              - column:
                  name: oidc_id_token_issued_at
                  type: timestamp
              - column:
                  name: oidc_id_token_expires_at
                  type: timestamp
              - column:
                  name: oidc_id_token_metadata
                  type: text

              # ---- refresh token ----
              - column:
                  name: refresh_token_value
                  type: text
              - column:
                  name: refresh_token_issued_at
                  type: timestamp
              - column:
                  name: refresh_token_expires_at
                  type: timestamp
              - column:
                  name: refresh_token_metadata
                  type: text

              # ---- user code (device flow) ----
              - column:
                  name: user_code_value
                  type: text
              - column:
                  name: user_code_issued_at
                  type: timestamp
              - column:
                  name: user_code_expires_at
                  type: timestamp
              - column:
                  name: user_code_metadata
                  type: text

              # ---- device code (device flow) ----
              - column:
                  name: device_code_value
                  type: text
              - column:
                  name: device_code_issued_at
                  type: timestamp
              - column:
                  name: device_code_expires_at
                  type: timestamp
              - column:
                  name: device_code_metadata
                  type: text

  - changeSet:
      id: 004-oauth2-authorization-indexes
      author: myapp
      changes:
        - createIndex:
            indexName: idx_oauth2_authorization_principal
            tableName: oauth2_authorization
            columns:
              - column:
                  name: principal_name
