databaseChangeLog:
  - changeSet:
      id: 001-create-user-related-tables
      author: yaroslav
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password_hash
                  type: VARCHAR(200)

              - column:
                  name: display_name
                  type: VARCHAR(200)

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role
            constraintName: pk_user_roles

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_users
            onDelete: CASCADE

        - createTable:
           tableName: user_identities
           columns:
             - column:
                 name: provider
                 type: VARCHAR(50)
                 constraints:
                   nullable: false

             - column:
                 name: subject
                 type: VARCHAR(255)
                 constraints:
                  nullable: false

             - column:
                 name: user_id
                 type: UUID
                 constraints:
                   nullable: false

        - addPrimaryKey:
            tableName: user_identities
            columnNames: provider, subject
            constraintName: pk_user_identities

        - addForeignKeyConstraint:
            baseTableName: user_identities
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_identities_users
            onDelete: CASCADE
