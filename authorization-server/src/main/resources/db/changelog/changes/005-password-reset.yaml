databaseChangeLog:
  - changeSet:
      id: 005-password-reset
      author: yaroslav
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_password_reset_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
