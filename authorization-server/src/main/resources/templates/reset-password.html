<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Set a new password</title>
    <link rel="stylesheet" th:href="@{/assets/auth.css}"/>
</head>
<body>
<main class="auth-card">
    <th:block th:if="${invalidToken}">
        <h1>Link expired</h1>
        <p class="auth-subtitle">This link is invalid or has expired</p>
        <div class="alert alert-error">
            The password reset link is invalid or has expired. Please request a new one.
        </div>
        <a class="btn btn-primary" th:href="@{/forgot-password}">Request a new link</a>
    </th:block>

    <th:block th:unless="${invalidToken}">
        <h1>Set a new password</h1>
        <p class="auth-subtitle">Choose a password of at least 12 characters</p>

        <form th:action="@{/reset-password}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{token}"/>
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" id="password" th:field="*{password}"
                       autocomplete="new-password" minlength="12" autofocus required/>
                <span class="field-error" th:errors="*{password}"></span>
            </div>
            <button type="submit" class="btn btn-primary">Set password</button>
        </form>

        <p class="auth-footer">
            <a th:href="@{/login}">Back to sign in</a>
        </p>
    </th:block>
</main>
</body>
</html>
