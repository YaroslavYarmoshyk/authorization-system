spring:
  application:
    name: gateway-service
  session:
    timeout: 30m
    data:
      redis:
        namespace: "may-app:session"
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
  security:
    oauth2:
      client:
        registration:
          my-auth:
            client-id: web-gateway
            client-secret: ${GATEWAY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
        provider:
          my-auth:
            issuer-uri: ${AUTHORIZATION_ISSUER}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders-api
              uri: ${ORDERS_SERVICE_URL}
              order: 0
              predicates:
                - Path=/api/orders/**
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie

server:
  reactive:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true
