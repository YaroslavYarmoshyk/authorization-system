services:
  postgres:
    image: 'postgres:18-bookworm'
    environment:
      - 'POSTGRES_DB=auth'
      - 'POSTGRES_PASSWORD=auth-password'
      - 'POSTGRES_USER=auth-user'
    ports:
      - '5432:5432'
    volumes: [pgdata:/var/lib/postgresql]

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
